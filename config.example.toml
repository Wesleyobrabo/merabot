[exchange]
api_key = "SUA_API_KEY_AQUI"
api_secret = "SUA_API_SECRET_AQUI"

testnet_api_key = "SUA_TESTNET_API_KEY_AQUI"
testnet_api_secret = "SUA_TESTNET_API_SECRET_AQUI"

testnet = true

[trading]
symbol = "SOLUSDT"
interval = "15m"
leverage = 1
margin_type = "ISOLATED"
paper_trading = false
initial_paper_balance = 100.0
auto_sync_balance = true
sync_balance_interval_secs = 60
fetch_real_balance_on_paper = false

[risk]
risk_per_trade_percent = 16.0
max_drawdown_percent = 35.0
max_position_usdt = 50.0
min_order_qty = 0.01
qty_precision = 2
price_precision = 2
sl_atr_multiplier = 1.5
tp_atr_multiplier = 2.0
slippage_percent = 0.05
enable_breakeven = true
breakeven_atr_multiplier = 1.0
enable_daily_loss_limit = true
max_daily_loss_percent = 25.0

[strategy]
name = "cascade_turbo_mtf"
supertrend_period = 22
supertrend_multiplier = 3.0
ema_fast_period = 9
ema_slow_period = 21
rsi_period = 14
rsi_overbought = 70.0
rsi_oversold = 30.0
enable_volume_filter = true
volume_sma_period = 20

[strategy.cascade]
enabled = true
length = 100
sd_entry = 2.0
min_norm_slope = 0.08
use_ignition = true
ign_atr_mult = 1.5
ign_vol_mult = 1.8
use_mtf = true
min_confluence = 0.70
atr_len = 22
atr_mult = 3.0
